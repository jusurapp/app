name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb rpm
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      # MSVC cannot create an object file or .pdb past ~250 characters. ggml
      # builds vulkan-shaders-gen through ExternalProject_Add, which nests a
      # second build tree under the cargo target dir, and CMake's try-compile
      # adds two more levels on top of that, enough to blow the limit from
      # D:\a\app\app\src-tauri\target and fail the compiler check.
      #
      # subst gives the target dir a short alias to build through. The real
      # directory is untouched, so every src-tauri/target/... path in the steps
      # below (and the rust cache) still resolves normally.
      - name: Shorten cargo target path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\target | Out-Null
          subst Z: (Resolve-Path src-tauri\target)
          echo "CARGO_TARGET_DIR=Z:\" >> $env:GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Apply crate patches
        shell: bash
        run: cd src-tauri && bash scripts/apply-patches.sh

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-jammy.list https://packages.lunarg.com/vulkan/lunarg-vulkan-jammy.list
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libclang-dev \
            clang \
            cmake \
            pkg-config \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libavfilter-dev \
            libavdevice-dev \
            libswscale-dev \
            libswresample-dev \
            libfuse2 \
            vulkan-sdk

      # macOS dependencies
      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg@7 cmake pkg-config dylibbundler
          FFMPEG_PREFIX=$(brew --prefix ffmpeg@7)
          SDKROOT=$(xcrun --show-sdk-path)
          echo "PKG_CONFIG_PATH=${FFMPEG_PREFIX}/lib/pkgconfig" >> $GITHUB_ENV
          echo "FFMPEG_DIR=${FFMPEG_PREFIX}" >> $GITHUB_ENV
          echo "SDKROOT=${SDKROOT}" >> $GITHUB_ENV
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> $GITHUB_ENV
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64-apple-darwin=-I${FFMPEG_PREFIX}/include -isysroot ${SDKROOT}" >> $GITHUB_ENV

      # Windows dependencies
      - name: Install FFmpeg (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $FFMPEG_VER = "7.1"
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/$FFMPEG_VER/ffmpeg-$FFMPEG_VER-full_build-shared.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath C:\ffmpeg-build
          $ffdir = "C:\ffmpeg-build\ffmpeg-$FFMPEG_VER-full_build-shared"
          echo "FFMPEG_DIR=$ffdir" >> $env:GITHUB_ENV
          echo "$ffdir\bin" >> $env:GITHUB_PATH


      - name: Install LLVM (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          choco install llvm --yes
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\lib" >> $env:GITHUB_ENV

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "1.4.309.0"
          $url = "https://sdk.lunarg.com/sdk/download/$ver/windows/VulkanSDK-$ver-Installer.exe"
          Invoke-WebRequest -Uri $url -OutFile VulkanSDK.exe
          Start-Process -FilePath .\VulkanSDK.exe -ArgumentList "--accept-licenses","--default-answer","--confirm-command","install" -Wait
          echo "VULKAN_SDK=C:\VulkanSDK\$ver" >> $env:GITHUB_ENV
          echo "C:\VulkanSDK\$ver\Bin" >> $env:GITHUB_PATH

      # ggml builds its Vulkan shader compiler via ExternalProject_Add. Under the
      # default Visual Studio generator MSBuild schedules that sub-project's
      # configure/build/install steps out of order once --parallel is in play, and
      # the install step fails on a cmake_install.cmake that does not exist yet.
      # Ninja honours the step dependencies. Windows-only: the Unix Makefiles
      # generator used on Linux does not have this problem.
      - name: Use Ninja generator (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja --yes
          }
          ninja --version
          echo "CMAKE_GENERATOR=Ninja" >> $env:GITHUB_ENV

      - name: Install npm dependencies
        run: npm ci

      # Windows: pre-build to locate DLLs, then copy them for NSIS bundling
      - name: Pre-build Rust (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -Clink-args=/FORCE:MULTIPLE
          CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: -Clink-args=/FORCE:MULTIPLE
        run: cd src-tauri && cargo build --release --target ${{ matrix.target }}

      - name: Bundle native DLLs (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p src-tauri/libs
          # llama.cpp shared libraries
          find src-tauri/target/${{ matrix.target }}/release/build/llama-cpp-sys-2-*/out -name "*.dll" -exec cp {} src-tauri/libs/ \;
          # FFmpeg shared libraries
          cp "${FFMPEG_DIR}/bin/"*.dll src-tauri/libs/
          # Visual C++ runtime
          cp /c/Windows/System32/msvcp140.dll src-tauri/libs/
          cp /c/Windows/System32/vcruntime140.dll src-tauri/libs/
          cp /c/Windows/System32/vcruntime140_1.dll src-tauri/libs/
          # OpenMP runtime (used by llama.cpp)
          cp /c/Windows/System32/vcomp140.dll src-tauri/libs/
          echo "Bundled DLLs:"
          ls -la src-tauri/libs/
          # Create Tauri config override to include DLLs as resources
          echo '{"bundle":{"resources":{"libs/*":"."}}}' > src-tauri/tauri.dll-bundle.conf.json

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: 1
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos-latest' && '11.0' || '' }}
          CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.platform == 'macos-latest' && '11.0' || '' }}
          APPLE_SIGNING_IDENTITY: "-"
          CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: ${{ matrix.target == 'x86_64-pc-windows-msvc' && '-Clink-args=/FORCE:MULTIPLE' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ matrix.platform == 'ubuntu-22.04' && '-Clink-args=-Wl,--allow-multiple-definition' || '' }}
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUSTFLAGS: ${{ matrix.target == 'aarch64-apple-darwin' && '-Clink-arg=-Wl,-headerpad_max_install_names' || '' }}
        with:
          # macOS: post-processing step creates and uploads the DMG manually
          tagName: ${{ runner.os != 'macOS' && github.ref_name || '' }}
          releaseName: ${{ runner.os != 'macOS' && format('Jusur {0}', github.ref_name) || '' }}
          releaseBody: "See the assets below to download and install Jusur."
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }} --bundles ${{ runner.os == 'macOS' && 'app' || matrix.bundles }}${{ matrix.platform == 'windows-latest' && ' --config src-tauri/tauri.dll-bundle.conf.json' || '' }}

      - name: Bundle dylibs and create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          APP="src-tauri/target/${{ matrix.target }}/release/bundle/macos/Jusur.app"
          FRAMEWORKS="$APP/Contents/Frameworks"
          BIN="$APP/Contents/MacOS/jusur"
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          DMG="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Jusur_${VERSION}_aarch64.dmg"

          mkdir -p "$FRAMEWORKS" "$(dirname "$DMG")"

          # Recursively bundle all non-system Homebrew dylibs
          RELEASE_DIR="src-tauri/target/${{ matrix.target }}/release"
          dylibbundler -od -b \
            -x "$BIN" \
            -d "$FRAMEWORKS" \
            -p "@executable_path/../Frameworks/" \
            -s "$RELEASE_DIR"

          # Re-sign everything (binary was invalidated by dylibbundler's install_name_tool changes)
          codesign --force --deep --sign - "$APP"

          # Create DMG
          mkdir -p /tmp/dmg_staging
          cp -r "$APP" /tmp/dmg_staging/
          ln -sf /Applications /tmp/dmg_staging/Applications
          hdiutil create -volname "Jusur" -srcfolder /tmp/dmg_staging -ov -format UDZO "$DMG"
          rm -rf /tmp/dmg_staging

      - name: Upload macOS DMG to release
        if: runner.os == 'macOS'
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          DMG="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/Jusur_${VERSION}_aarch64.dmg"
          gh release create "${{ github.ref_name }}" \
            --title "Jusur ${{ github.ref_name }}" \
            --notes "See the assets below to download and install Jusur." \
            || true
          gh release upload "${{ github.ref_name }}" "$DMG" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

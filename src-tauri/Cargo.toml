[package]
name = "jusur"
version = "0.1.0"
description = "Jusur - Jusur Desktop App"
authors = ["you"]
edition = "2021"
default-run = "jusur"

[lib]
name = "jusur_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
zip = "2"
tempfile = "3"
dirs = "6"
url = "2"
hound = "3"
encoding_rs = "0.8"
ffmpeg-next = "7"
urlencoding = "2"
chrono = "0.4"

# whisper-rs-sys and llama-cpp-sys-2 each bundle their own ggml, and the linker
# resolves the duplicate ggml_* symbols arbitrarily (see .cargo/config.toml).
# Their backends MUST therefore stay in lockstep, enabling vulkan on only one
# can yield a binary that silently runs on CPU or faults inside the backend.
[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan"] }
llama-cpp-2 = { version = "0.1", features = ["dynamic-link", "vulkan"] }

# macOS is deliberately left CPU-only for now
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = "0.16"
llama-cpp-2 = { version = "0.1", features = ["dynamic-link"] }


[package.metadata.patch.ffmpeg-sys-next]
version = "7.1.3"
patches = ["patches/ffmpeg-sys-next.patch"]

[package.metadata.patch.llama-cpp-sys-2]
version = "0.1.138"
patches = ["patches/llama-cpp-sys-2.patch"]

[patch.crates-io]
ffmpeg-sys-next = { path = ".patches/ffmpeg-sys-next-7.1.3" }
llama-cpp-sys-2 = { path = ".patches/llama-cpp-sys-2-0.1.138" }
